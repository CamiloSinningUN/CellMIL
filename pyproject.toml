[project]
name = "cellmil"
version = "0.1.0"
description = "cell instance segmentation for multiple instance learning in digital pathology"
authors = [{ name = "CamiloSinningUN", email = "camilosinning.cs@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "numpy (>=1.23,<2.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "openslide-python (>=1.4.2,<2.0.0)",
    "natsort (>=8.4.0,<9.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "shapely (>=2.1.1,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "rasterio (>=1.4.3,<2.0.0)",
    "opencv-python-headless (>=4.11.0.86,<5.0.0.0)",
    "scikit-image (>=0.25.2,<0.26.0)",
    "ujson (>=5.10.0,<6.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "scipy (<=1.11.4)",
    "einops (>=0.8.1,<0.9.0)",
    "cellpose @ git+https://www.github.com/mouseland/cellpose.git",
    "matplotlib (>=3.10.3,<4.0.0)",
    "topk @ git+https://github.com/oval-group/smooth-topk.git",
    "dash (>=3.1.1,<4.0.0)",
    "scikit-learn (>=1.7.0,<2.0.0)",
    "wandb (>=0.21.0,<0.22.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "torchmetrics (>=1.7.4,<2.0.0)",
    "nystrom-attention (>=0.0.14,<0.0.15)",
    "future (>=1.0.0,<2.0.0)",
    "torch-geometric (>=2.7.0,<3.0.0)",
    "torch (==2.7.1)",
    "torchvision (==0.22.1)",
    "torchaudio (==2.7.1)",
    "torch-cluster (>=1.6.3,<2.0.0)",
    "networkx[default] (==3.4.2)",
    "egnn-pytorch (>=0.2.8,<0.3.0)",
    "lightning (>=2.5.3,<3.0.0)",
    "openslide-bin (>=4.0.0.8,<5.0.0.0)",
    "timm (>=1.0.19,<2.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-html (>=4.1.1,<5.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "networkx-stubs (>=0.0.1,<0.0.2)",
    "kaleido (>=1.1.0,<2.0.0)",
    "dash-bootstrap-components (>=2.0.4,<3.0.0)",
    "torch-sparse (>=0.6.18,<0.7.0)",
    "torch-scatter (>=2.1.2,<3.0.0)",
    "pyg-lib (>=0.5.0,<0.6.0)",
    "statsmodels (>=0.14.5,<0.15.0)",
    "bambi (==0.15.0)",
    "weasyprint (>=66.0,<67.0)",
    "scikit-survival (>=0.25.0,<0.26.0)",
    "lifelines (>=0.30.0,<0.31.0)",
    "shap (==0.49.1)"
]

[tool.poetry]
packages = [{ include = "cellmil", from = "." }]

[tool.poetry.scripts]
patch_extraction = "cellmil.cli.patch_extraction:main"
cell_segmentation = "cellmil.cli.cell_segmentation:main"
feature_extraction = "cellmil.cli.feature_extraction:main"
create_dataset = "cellmil.cli.dataset_creation:main"
vis_features = "cellmil.cli.visualize_features:main"
graph_creation = "cellmil.cli.graph_creation:main"
stats_print = "cellmil.cli.stats_print:main"
eval_report = "cellmil.cli.eval_report:main"

[tool.poetry.group.dev.dependencies]
sphinx-copybutton = "^0.5.2"
shibuya = "2025.7.24"
sphinx = "5.3.0"


[[tool.poetry.source]]
name = "torch-cu118"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"


[[tool.poetry.source]]
name = "pyg-cu118"
url = "https://data.pyg.org/whl/torch-2.7.0+cu118.html"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "torch-cu118"}
torchvision = {source = "torch-cu118"}
torchaudio = {source = "torch-cu118"}
torch-cluster = {source = "pyg-cu118"}
torch-sparse = {source = "pyg-cu118"}
torch-scatter = {source = "pyg-cu118"}
pyg-lib = {source = "pyg-cu118"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
